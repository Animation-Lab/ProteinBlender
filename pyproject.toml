[project]
name = "proteinblender"
version = "1.2.0"
description = "Visualize and animate proteins in Blender"
readme = "README.md"
# build.py feeds this list straight to `pip download` once per (python version,
# platform) pair, so an open upper bound resolves to a different release per pair
# and ships several versions of one package in a single build.
dependencies = [
    # Capped below 0.8: databpy 0.8.0's attribute.py references
    # bpy.types.Float4Attribute at module scope, a type that only exists in
    # Blender 5.2+. On 5.0/5.1 importing databpy raises AttributeError, so the
    # add-on fails to load. 1.0.9 shipped 0.8.0 and broke on 5.0/5.1. The cap
    # (rather than an exact pin) keeps the newest 0.7.x, which works on all of
    # 5.0/5.1/5.2 (it uses only pre-5.2 attribute types).
    "databpy>=0.0.18,<0.8",
    "MDAnalysis>=2.7.0",
    # Capped below 1.7: the embedded MolecularNodes imports
    # biotite.structure.connect_via_residue_names at module scope
    # (utils/molecularnodes/entities/molecule/pdb.py), which biotite 1.7 removed.
    # Uncapped, 1.0.6 shipped 1.7.1 to Blender 5.x on Windows and macOS-arm64,
    # where importing the PDB reader raises ImportError. The cap (rather than an
    # exact pin) keeps each platform on the newest biotite it has a wheel for -
    # manylinux_2_17 only resolves as far as 1.4.0.
    "biotite>=1.1,<1.7",
    "mrcfile",
    "starfile",
    "PyYAML"
]
maintainers = [{name = "Dillon Lee", email = "dlee123@gmail.com"}]
requires-python = "~=3.11"

[project.urls]
Homepage = "https://github.com/Animation-Lab/ProteinBlender"
Repository = "https://github.com/Animation-Lab/ProteinBlender"
Documentation = "https://animation-lab.github.io/ProteinBlender/"

[project.optional-dependencies]
bpy = ["bpy>=4.4"]
jupyter = ["jupyter", "IPython"]
dev = ["pytest", "pytest-cov", "syrupy", "scipy", "fake-bpy-module", "IPython"]
test = ["pytest", "pytest-cov", "syrupy", "scipy", "IPython"]
docs = ["quartodoc", "tomlkit", "nodepad", "jupyter", "IPython", "jupyter-cache"]

[tool.pytest.ini_options]
# The suite runs inside Blender's Python (see tests/run_blender.py). Test
# discovery is scoped to tests/; markers are declared in tests/conftest.py.
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --tb=short"
# The vendored MolecularNodes ships its own tests; they are not part of this suite.
#
# tests/live is excluded from ordinary discovery on purpose. That lane runs in
# system Python and attaches to a Blender the developer already has open; if the
# headless suite collected it, a background test run would reach out over the
# socket and drive the user's live session. Run it deliberately, through
# tests/run_live_tests.py.
norecursedirs = [
    "proteinblender/utils/molecularnodes",
    "tests/live",
    "*.egg", "dist", "build", ".git",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[tool.setuptools]
include-package-data = true
packages = ["proteinblender"]

[tool.setuptools.package-data]
proteinblender = ["utils/molecular_nodes/assets/*", "utils/molecular_nodes/assets/template/*", "**/*.py"]
