[project]
name = "proteinblender"
version = "1.0.6"
description = "Visualize and animate proteins in Blender"
readme = "README.md"
dependencies = [
    "databpy>=0.0.18",
    "MDAnalysis>=2.7.0",
    "biotite>=1.1",
    "mrcfile",
    "starfile",
    "PyYAML"
]
maintainers = [{name = "Dillon Lee", email = "dlee123@gmail.com"}]
requires-python = "~=3.11"

[project.urls]
Homepage = "https://github.com/Animation-Lab/ProteinBlender"
Repository = "https://github.com/Animation-Lab/ProteinBlender"
Documentation = "https://animation-lab.github.io/ProteinBlender/"

[project.optional-dependencies]
bpy = ["bpy>=4.4"]
jupyter = ["jupyter", "IPython"]
dev = ["pytest", "pytest-cov", "syrupy", "scipy", "fake-bpy-module", "IPython"]
test = ["pytest", "pytest-cov", "syrupy", "scipy", "IPython", "pytest-xdist"]
docs = ["quartodoc", "tomlkit", "nodepad", "jupyter", "IPython", "jupyter-cache"]

[tool.pytest.ini_options]
# The suite runs inside Blender's Python (see tests/run_blender.py). Test
# discovery is scoped to tests/; markers are declared in tests/conftest.py.
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --tb=short"
# Only collect the new pytest suite — the legacy hand-run scripts and vendored
# MolecularNodes tests are not part of it.
norecursedirs = [
    "tests/feature_audit",
    "tests/stress_test",
    "tests/stress_test_workdir",
    "proteinblender/utils/molecularnodes",
    "*.egg", "dist", "build", ".git",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[tool.setuptools]
include-package-data = true
packages = ["proteinblender"]

[tool.setuptools.package-data]
proteinblender = ["utils/molecular_nodes/assets/*", "utils/molecular_nodes/assets/template/*", "**/*.py"]
