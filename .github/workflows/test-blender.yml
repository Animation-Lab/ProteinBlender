name: Blender Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-suite:
    name: Source / Blender ${{ matrix.blender }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # The manifest floor (5.0, also the last release on Python 3.11), the
        # interim 5.1 release (whose pre-5.2 geometry-nodes modifier-input API
        # differs), and the current development target.
        # 4.2 was dropped when blender_version_min moved to 5.0.0.
        blender: ["5.0", "5.1", "5.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: bradyajohnston/setup-blender@v4
        with:
          version: ${{ matrix.blender }}
      - name: Bootstrap pytest in Blender
        run: blender --background --factory-startup --python-exit-code 12 --python tests/ci/bootstrap_pytest.py
      - name: Run complete offline suite
        env:
          BLENDER_PATH: blender
        run: python tests/run_tests.py -m "not network" -v --strict-markers

  artifact:
    name: Installed extension artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: bradyajohnston/setup-blender@v4
        with:
          version: "5.2"
      - name: Build, validate, install, enable, and reopen ZIP
        run: python tests/artifact/run_artifact_tests.py --blender blender --prepare-wheels

  foreground-ui:
    name: Foreground event-simulation UI / Blender ${{ matrix.blender }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The workspace-layout assertions (verify_workspace_ui) only run here,
        # so exercise the same ABIs the source suite covers - the first 5.x
        # (5.0), the release users are on (5.1), and the dev target (5.2).
        # A stray Scene-Collection Outliner in the panel column regressed
        # identically on every version; a single-version job never caught it.
        blender: ["5.0", "5.1", "5.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: bradyajohnston/setup-blender@v4
        with:
          version: ${{ matrix.blender }}
      - name: Run Blender with a real X display and window event loop
        env:
          PB_STRICT_CONTEXT: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/run_ui_tests.py --blender blender --keep-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foreground-ui-report-${{ matrix.blender }}
          path: ui-test-report.json
          if-no-files-found: warn
