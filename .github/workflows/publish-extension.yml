name: Publish Blender Extension

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_run:
    workflows: ["Track Repository Traffic"]
    types: [completed]
  workflow_dispatch:  # Allow manual triggering

# Add permissions here
permissions:
  contents: write  # Required to push to gh-pages branch
  pages: write      # Required to deploy to GitHub Pages
  id-token: write   # Required for OIDC (if using newer auth)

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby for Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: docs

      - name: Build Jekyll site
        run: |
          cd docs
          bundle install
          bundle exec jekyll build --destination ../_site
          cd ..
          echo "✓ Jekyll site built successfully"
          ls -lah _site/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate extension repository index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install dependencies
          pip install tomli requests

          # Generate index.json with URLs pointing to GitHub Releases
          python .github/scripts/generate_index.py

          # Move to site extensions directory
          mkdir -p _site/extensions
          mv index.json _site/extensions/

          # Verify the index was created
          if [ -f _site/extensions/index.json ]; then
            echo "✓ index.json generated successfully"
            cat _site/extensions/index.json
          else
            echo "✗ Failed to generate index.json"
            exit 1
          fi

      - name: Prepare commit message
        id: commit_msg
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "message=Update site and extensions - ${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "message=Update site and extensions (run #${{ github.run_number }})" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: ${{ steps.commit_msg.outputs.message }}
