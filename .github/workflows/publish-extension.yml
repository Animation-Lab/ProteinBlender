name: Publish Blender Extension

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:  # Allow manual triggering

# Add permissions here
permissions:
  contents: write  # Required to push to gh-pages branch
  pages: write      # Required to deploy to GitHub Pages
  id-token: write   # Required for OIDC (if using newer auth)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby for Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: docs

      - name: Build Jekyll site
        run: |
          cd docs
          bundle install
          bundle exec jekyll build --destination ../_site
          cd ..
          echo "✓ Jekyll site built successfully"
          ls -lah _site/

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create extensions directory inside the built site
          mkdir -p _site/extensions

          # Get all releases and download their .zip assets
          gh release list --limit 100 | while read -r line; do
            tag=$(echo "$line" | awk '{print $3}')
            echo "Processing release: $tag"

            # Download all .zip files from this release
            gh release download "$tag" -p "*.zip" -D _site/extensions/ || echo "No zips for $tag"
          done

          ls -lah _site/extensions/

      - name: Set up Blender
        run: |
          # Download Blender 4.2+ (required for extension command)
          wget -q https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          tar -xf blender-4.2.0-linux-x64.tar.xz
          echo "$(pwd)/blender-4.2.0-linux-x64" >> $GITHUB_PATH

      - name: Generate extension repository index
        run: |
          # Use Blender to generate the index.json
          ./blender-4.2.0-linux-x64/blender --background --command extension server-generate --repo-dir=_site/extensions/

          # Verify the index was created
          if [ -f _site/extensions/index.json ]; then
            echo "✓ index.json generated successfully"
            cat _site/extensions/index.json
          else
            echo "✗ Failed to generate index.json"
            exit 1
          fi

      - name: Prepare commit message
        id: commit_msg
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "message=Update site and extensions - ${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "message=Update site and extensions (run #${{ github.run_number }})" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: ${{ steps.commit_msg.outputs.message }}
