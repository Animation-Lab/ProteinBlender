name: Publish Blender Extension

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_run:
    workflows: ["Track Repository Traffic"]
    types: [completed]
  workflow_dispatch:  # Allow manual triggering

# Add permissions here
permissions:
  contents: write  # Required to push to gh-pages branch
  pages: write      # Required to deploy to GitHub Pages
  id-token: write   # Required for OIDC (if using newer auth)

# One publish at a time, in trigger order. Each run rebuilds every page and
# both extension indexes from the Releases API and replaces gh-pages, so two
# overlapping runs race and the last to finish wins, even when it read the API
# before the other's release existed (a docs push put alpha 1.2.4 back over
# 1.2.5 this way). Queued, a later run always reads a later state; GitHub
# keeps only the newest waiting run, which is fine since each run rebuilds
# everything. Never cancel in progress: a docs push right after a release
# would drop the release's run.
concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Pinned, not ubuntu-latest: setup-ruby needs a Ruby prebuilt for this exact
    # image. When ubuntu-latest moved to 26.04 before a 3.1.7 build existed for
    # it, every publish failed for eleven days. Move the pin on purpose.
    runs-on: ubuntu-26.04

    steps:
      # Always build the site from `main`, never from the ref that happened to
      # trigger this run. actions/checkout defaults to the triggering ref, which
      # differs per trigger: a published release gives the release tag, but
      # `workflow_run` gives the default branch. Because Track Repository Traffic
      # fires daily, a release deployed from a tag whose docs/ was ahead of main
      # was silently reverted the next day by the traffic run rebuilding from
      # main's older docs/. That destroyed hand-authored tutorial content on the
      # live index.html repeatedly, with no conflict and no warning.
      #
      # Pinning to main makes the published site a pure function of main's docs/,
      # so the page no longer depends on which trigger fired. This is safe for the
      # extension indexes: generate_index.py builds them from the GitHub Releases
      # API, not from the checked-out tree, so alpha and release channels are
      # still indexed correctly regardless of the ref checked out here.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby for Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: docs

      - name: Build Jekyll site
        run: |
          cd docs
          bundle install
          bundle exec jekyll build --destination ../_site
          cd ..
          echo "✓ Jekyll site built successfully"
          ls -lah _site/

      # The traffic ledger lives on the dedicated `traffic-data` branch, not in
      # the code trunk, so pull its JSON into the published site here. The
      # dashboard (traffic.html) fetches /data/traffic/{daily,latest}.json.
      - name: Add traffic ledger to the site
        run: |
          if git fetch origin traffic-data --depth=1 2>/dev/null; then
            mkdir -p _site/data/traffic
            git show origin/traffic-data:daily.json  > _site/data/traffic/daily.json
            git show origin/traffic-data:latest.json > _site/data/traffic/latest.json
            echo "✓ traffic ledger copied into _site/data/traffic"
          else
            echo "traffic-data branch not found yet; skipping traffic ledger"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate extension repository index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Write channel indexes straight into the Pages output:
          #   release -> _site/extensions/index.json
          #   alpha   -> _site/extensions/alpha/index.json
          OUTPUT_DIR: _site/extensions
        run: |
          # Install dependencies
          pip install tomli requests

          # Generate per-channel index.json files (URLs point to GitHub Releases)
          python .github/scripts/generate_index.py

          # Verify both channel indexes were created
          ok=true
          for idx in _site/extensions/index.json _site/extensions/alpha/index.json; do
            if [ -f "$idx" ]; then
              echo "✓ $idx generated successfully"
              cat "$idx"
            else
              echo "✗ Failed to generate $idx"
              ok=false
            fi
          done
          $ok || exit 1

      - name: Prepare commit message
        id: commit_msg
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "message=Update site and extensions - ${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "message=Update site and extensions (run #${{ github.run_number }})" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: ${{ steps.commit_msg.outputs.message }}
